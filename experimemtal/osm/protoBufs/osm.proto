syntax = "proto3";
package protoBuffs;

option go_package = "/osmProtobufs";

message Way{
    optional int32 id = 1;
    message Geometry{
        optional float lat = 1;
        optional float lon = 2;
    }
    repeated Geometry geometry = 2;
    message Bounds {
        optional float minlat = 1;
        optional float minlon = 2;
        optional float maxlat = 3;
        optional float maxlon = 4;
    }
    optional Bounds bounds = 3;
    map<string, string> tags = 4;
}