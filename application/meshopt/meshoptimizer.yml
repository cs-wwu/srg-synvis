---
GENERATOR:
  PackageName: meshoptimizer
  PackageDescription: "Package meshoptimizer provides Go bindings for meshoptimizer.h"
  PackageLicense: "MIT License"
  SysIncludes:
    - meshoptimizer.h
  FlagGroups:
    - { name: "LDFLAGS", flags: ["-lmeshoptimizer"] }
  Options:
    SafeStrings: true

PARSER:
  IncludePaths: ["/usr/include"]
  SourcesPaths: ["meshoptimizer.h"]

TRANSLATOR:
  ConstRules:
    defines: expand
  Rules:
    global:
      - { action: accept, from: "^meshopt_" }
      - { action: replace, from: "^MESHOPTIMIZER_" }
      - { action: replace, from: "^meshopt_" }
      - { load: snakecase }
    const:
      - { action: ignore, from: "MESHOPTIMIZER_API" }
      - { action: ignore, from: "MESHOPTIMIZER_EXPERIMENTAL" }
      - { action: ignore, from: "MESHOPTIMIZER_ALLOC_CALLCONV" }
      - { action: accept, from: "^MESHOPTIMIZER_" }
      - { transform: export }
    function:
      - { action: ignore, from: "meshopt_setAllocator" } # CGo does memory alloc
    post-global:
      - { transform: export }