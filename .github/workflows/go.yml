# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23.5"
          cache: true

      - name: Install Graphics and Vulkan Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          mesa-vulkan-drivers \
          vulkan-tools \
          libvulkan-dev \
          vulkan-validationlayers-dev \
          spirv-tools \
          libglfw3-dev \
          libglm-dev \
          libxi-dev \
          libxxf86vm-dev

      - name: Enter application and download dependencies
        run: |
          cd ./application
          go mod download

      - name: Run Test
        run: |
          cd ./application
          go test -v ./test
