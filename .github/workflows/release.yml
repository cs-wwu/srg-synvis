name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Builds the artifact without publishing a release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: ./go.mod
          cache-dependency-path: ./go.sum

      - name: Install Graphics and Vulkan Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mesa-vulkan-drivers \
            vulkan-tools \
            libvulkan-dev \
            vulkan-utility-libraries-dev \
            spirv-tools \
            libglfw3-dev \
            libglm-dev \
            libxi-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Build
        run: |
          go build -trimpath -ldflags "-s -w" -o dist/svs ./cmd/svs
          go build -trimpath -ldflags "-s -w" -o dist/download ./cmd/download

      # The binary loads shaders, fonts, models, etc. from ./assets at runtime
      - name: Package
        run: |
          NAME="svs-${GITHUB_REF_NAME}-linux-amd64"
          mkdir -p "$NAME"
          cp dist/svs dist/download LICENSE README.md .env.example "$NAME"/
          cp -r assets "$NAME"/assets
          tar -czf "$NAME.tar.gz" "$NAME"
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "ARCHIVE=$NAME.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: svs-linux-amd64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
