syntax = "proto3";

package obstructions;

option java_package = "com.jeetbrains.greeting.kmd.proto";
option java_outer_classname = "ObstructionsProto";

message FAAPoint {
  double lat = 1;
  double lon = 2;
  double height = 3;
  string type = 4;
  double quantity = 5;
}

message ObstructionSquare {
  int32 lat_deg = 1;
  int32 lon_deg = 2;
  repeated FAAPoint obstructions = 3;
}
